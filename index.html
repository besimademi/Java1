<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Java 1</title>
</head>
<body>

  <h1>Mirë se vini</h1>
  <p>Kjo është faqja ime e parë në GitHub Pages</p>

  <!-- ===== MBLEDHJA ===== -->
  <h2>Mbledhja (+)</h2>
  <label>Numri 1</label>
  <input type="number" id="mbledhja1">
  <br>
  <label>Numri 2</label>
  <input type="number" id="mbledhja2">
  <br>
  <button type="button" onclick="mbledhja()">Kalkulo</button>
  <p id="rezultatiMbledhja"></p>
  <hr>

  <!-- ===== ZBRITJA ===== -->
  <h2>Zbritja (-)</h2>
  <label>Numri 1</label>
  <input type="number" id="zbritja1">
  <br>
  <label>Numri 2</label>
  <input type="number" id="zbritja2">
  <br>
  <button type="button" onclick="zbritjaNumrave()">Kalkulo</button>
  <p id="rezultatiZbritja"></p>
  <hr>

  <!-- ===== SHUMËZIMI ===== -->
  <h2>Shumëzimi (×)</h2>
  <label>Numri 1</label>
  <input type="number" id="shumezimi1">
  <br>
  <label>Numri 2</label>
  <input type="number" id="shumezimi2">
  <br>
  <button type="button" onclick="shumezimi()">Kalkulo</button>
  <p id="rezultatiShumezimi"></p>
  <hr>

  <!-- ===== PJESËTIMI ===== -->
  <h2>Pjesëtimi (÷)</h2>
  <label>Numri 1</label>
  <input type="number" id="pjesetimi1">
  <br>
  <label>Numri 2</label>
  <input type="number" id="pjesetimi2">
  <br>
  <button type="button" onclick="pjesetimi()">Kalkulo</button>
  <p id="rezultatiPjesetimi"></p>
  <hr>

  <!-- ===== RRITJE / ZBRITJE ===== -->
  <h2>Rritje / Zbritje e numrit</h2>
  <button type="button" onclick="rritje()">Rritje +</button>
  <button type="button" onclick="zbritje()">Zbritje -</button>
  <p id="numeruesi">0</p>

  <script>
    // Merr vlerën e një input-i si numër
    function merrNumrin(id) {
      return Number(document.getElementById(id).value);
    }

    // Shfaq rezultatin në një element
    function shfaq(id, vlera) {
      document.getElementById(id).innerHTML = vlera;
    }

    // ===== Kalkulatori =====
    function mbledhja() {
      var a = merrNumrin('mbledhja1');
      var b = merrNumrin('mbledhja2');
      shfaq('rezultatiMbledhja', 'Rezultati: ' + (a + b));
    }

    function zbritjaNumrave() {
      var a = merrNumrin('zbritja1');
      var b = merrNumrin('zbritja2');
      shfaq('rezultatiZbritja', 'Rezultati: ' + (a - b));
    }

    function shumezimi() {
      var a = merrNumrin('shumezimi1');
      var b = merrNumrin('shumezimi2');
      shfaq('rezultatiShumezimi', 'Rezultati: ' + (a * b));
    }

    function pjesetimi() {
      var a = merrNumrin('pjesetimi1');
      var b = merrNumrin('pjesetimi2');

      if (b === 0) {
        shfaq('rezultatiPjesetimi', 'Nuk mund të pjesëtoni me 0');
      } else {
        shfaq('rezultatiPjesetimi', 'Rezultati: ' + (a / b));
      }
    }

    // ===== Numëruesi =====
    var n = 0;

    function rritje() {
      n = n + 1;
      shfaq('numeruesi', n);
    }

    function zbritje() {
      n = n - 1;
      shfaq('numeruesi', n);
    }
  </script>

</body>
</html>
